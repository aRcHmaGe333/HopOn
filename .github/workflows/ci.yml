name: CI — Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for file in ('web/index.html', 'docs/index.html'):
              text = Path(file).read_text(encoding='utf-8')
              m = re.search(r'<script>([\\s\\S]*?)</script>', text)
              if not m:
                  raise SystemExit(f'No inline script in {file}')
              Path('/tmp/hopon-check.js').write_text(m.group(1))
              import subprocess
              subprocess.run(['node', '--check', '/tmp/hopon-check.js'], check=True)
              print(file, 'JavaScript syntax OK')
          PY
